name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Check Xcode / iOS SDK
      # ============================================================
      - name: Check Xcode and iOS SDK
        run: |
          set -e

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== iOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      # ============================================================
      # 3. Download SDL libraries
      # ============================================================
      - name: Download SDL libraries
        run: |
          set -e

          mkdir -p external

          echo "===== SDL2 ====="

          git clone \
            --depth 1 \
            --branch release-2.32.8 \
            https://github.com/libsdl-org/SDL.git \
            external/SDL

          echo "===== SDL2_image ====="

          git clone \
            --depth 1 \
            --branch release-2.8.8 \
            https://github.com/libsdl-org/SDL_image.git \
            external/SDL_image

          echo "===== SDL2_ttf ====="

          git clone \
            --depth 1 \
            --branch release-2.24.0 \
            https://github.com/libsdl-org/SDL_ttf.git \
            external/SDL_ttf

          echo ""
          echo "===== External directories ====="

          find external -maxdepth 2 -type d -print

      # ============================================================
      # 4. Download SDL2_image dependencies
      # ============================================================
      - name: Download SDL2_image dependencies
        run: |
          set -e

          echo "========================================"
          echo "Downloading SDL2_image dependencies"
          echo "========================================"

          cd external/SDL_image

          if [ ! -f "external/download.sh" ]; then
            echo "ERROR: SDL2_image download.sh not found"
            exit 1
          fi

          chmod +x external/download.sh

          ./external/download.sh

          echo ""
          echo "===== SDL2_image external ====="

          find external \
            -maxdepth 4 \
            -print || true

          echo ""
          echo "===== Searching for libtiff ====="

          find . \
            -type d \
            -iname "*tiff*" \
            -print || true

          find . \
            -type f \
            -iname "*tiff*" \
            -print | head -100 || true

          cd ../..

      # ============================================================
      # 5. Verify SDL2_image dependencies
      # ============================================================
      - name: Verify SDL2_image dependencies
        run: |
          set -e

          echo "========================================"
          echo "Verifying SDL2_image dependencies"
          echo "========================================"

          echo ""
          echo "===== SDL2_image directory ====="

          find external/SDL_image \
            -maxdepth 4 \
            -print | head -300

          echo ""
          echo "===== Searching for libtiff ====="

          TIFF_DIR="$(find external \
            -type d \
            -iname 'libtiff' \
            | head -n 1 || true)"

          if [ -z "$TIFF_DIR" ]; then
            echo ""
            echo "ERROR: libtiff was not found."
            echo ""
            echo "===== external tree ====="

            find external \
              -maxdepth 5 \
              -print | head -700

            exit 1
          fi

          echo ""
          echo "Found libtiff:"
          echo "$TIFF_DIR"

          echo ""
          echo "===== Checking libtiff CMakeLists.txt ====="

          if [ ! -f "$TIFF_DIR/CMakeLists.txt" ]; then
            echo ""
            echo "ERROR: libtiff directory exists but CMakeLists.txt is missing."

            find "$TIFF_DIR" \
              -maxdepth 3 \
              -print

            exit 1
          fi

          echo ""
          echo "libtiff CMake project found."

      # ============================================================
      # 6. Download SDL2_ttf dependencies
      # ============================================================
      - name: Download SDL2_ttf dependencies
        run: |
          set -e

          echo "========================================"
          echo "Downloading SDL2_ttf dependencies"
          echo "========================================"

          cd external/SDL_ttf

          if [ ! -f "external/download.sh" ]; then
            echo "ERROR: SDL2_ttf download.sh not found"
            exit 1
          fi

          chmod +x external/download.sh

          ./external/download.sh

          cd ../..

          echo ""
          echo "===== Searching for FreeType ====="

          find external/SDL_ttf \
            -iname "ft2build.h" \
            -print | head -100

      # ============================================================
      # 7. Verify FreeType
      # ============================================================
      - name: Verify FreeType
        run: |
          set -e

          echo "========================================"
          echo "Verifying FreeType"
          echo "========================================"

          if find external/SDL_ttf \
            -type f \
            -name "ft2build.h" \
            | grep -q .; then

            echo "FreeType OK"

          else

            echo "ERROR: FreeType not found"

            find external/SDL_ttf \
              -maxdepth 5 \
              -print

            exit 1

          fi

      # ============================================================
      # 8. Check project files
      # ============================================================
      - name: Check project files
        run: |
          set -e

          echo "===== Root ====="
          ls -la

          echo ""
          echo "===== src ====="

          if [ -d "src" ]; then
            find src \
              -maxdepth 4 \
              -type f \
              | head -200
          fi

          echo ""
          echo "===== CMakeLists.txt ====="

          if [ -f "CMakeLists.txt" ]; then
            sed -n '1,260p' CMakeLists.txt
          else
            echo "ERROR: CMakeLists.txt not found"
            exit 1
          fi

      # ============================================================
      # 9. Configure iOS ARM64
      # ============================================================
      - name: Configure iOS ARM64
        run: |
          set -e

          echo "========================================"
          echo "Configuring iOS ARM64"
          echo "========================================"

          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL2_SHARED=OFF \
            -DSDL2IMAGE_VENDORED=ON \
            -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_TESTS=OFF \
            -DSDL2IMAGE_AVIF=OFF \
            -DSDL2IMAGE_WEBP=OFF \
            -DSDL2IMAGE_JXL=OFF \
            -DSDL2TTF_VENDORED=ON \
            -DSDL2TTF_SAMPLES=OFF \
            -DSDL2TTF_TESTS=OFF

      # ============================================================
      # 10. Build
      # ============================================================
      - name: Build iOS ARM64
        run: |
          set -e

          echo "========================================"
          echo "Building th06"
          echo "========================================"

          cmake \
            --build build \
            --config Release \
            --parallel 4

      # ============================================================
      # 11. Find application
      # ============================================================
      - name: Find application
        run: |
          set -e

          echo "===== Applications ====="

          find build \
            -type d \
            -name "*.app" \
            -print

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          echo ""
          echo "Application:"
          echo "$APP"

      # ============================================================
      # 12. Verify iOS ARM64 binary
      # ============================================================
      - name: Verify iOS ARM64 binary
        run: |
          set -e

          echo "========================================"
          echo "Verifying iOS ARM64"
          echo "========================================"

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          BIN="$APP/th06"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: th06 executable not found"
            exit 1
          fi

          echo ""
          echo "===== file ====="
          file "$BIN"

          echo ""
          echo "===== lipo ====="
          lipo -info "$BIN"

          echo ""
          echo "===== Mach-O ====="
          otool -l "$BIN" \
            | grep -A8 LC_BUILD_VERSION || true

          echo ""
          echo "===== ARM64 check ====="

          if ! lipo -info "$BIN" | grep -q "arm64"; then
            echo "ERROR: ARM64 not found"
            exit 1
          fi

          echo "ARM64: OK"

          echo ""
          echo "===== iOS check ====="

          if ! otool -l "$BIN" \
            | grep -A8 LC_BUILD_VERSION \
            | grep -q "PLATFORM_IOS"; then

            echo "ERROR: PLATFORM_IOS not found"
            exit 1
          fi

          echo "iOS: OK"

          echo ""
          echo "========================================"
          echo "iOS ARM64 verification PASSED"
          echo "========================================"

      # ============================================================
      # 13. Package resources
      # ============================================================
      - name: Package game resources
        run: |
          set -e

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          echo "Application:"
          echo "$APP"

          if [ -d "resources" ]; then
            echo "Copying resources..."
            cp -R resources "$APP/"
          else
            echo "No resources directory found."
          fi

          echo ""
          echo "===== APP CONTENTS ====="

          find "$APP" \
            -maxdepth 4 \
            -print

      # ============================================================
      # 14. Check Info.plist
      # ============================================================
      - name: Check Info.plist
        run: |
          set -e

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          if [ ! -f "$APP/Info.plist" ]; then

            echo "Creating Info.plist..."

            cat > "$APP/Info.plist" <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
  "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

<plist version="1.0">
<dict>

    <key>CFBundleExecutable</key>
    <string>th06</string>

    <key>CFBundleIdentifier</key>
    <string>com.example.th06</string>

    <key>CFBundleName</key>
    <string>th06</string>

    <key>CFBundleDisplayName</key>
    <string>東方紅魔郷</string>

    <key>CFBundlePackageType</key>
    <string>APPL</string>

    <key>CFBundleShortVersionString</key>
    <string>1.0</string>

    <key>CFBundleVersion</key>
    <string>1</string>

    <key>LSRequiresIPhoneOS</key>
    <true/>

    <key>UIDeviceFamily</key>
    <array>
        <integer>1</integer>
    </array>

</dict>
</plist>
PLIST

          else

            echo "Info.plist already exists."

          fi

          echo ""
          echo "===== Info.plist ====="
          cat "$APP/Info.plist"

      # ============================================================
      # 15. Create IPA
      # ============================================================
      - name: Create IPA
        run: |
          set -e

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          rm -rf Payload
          rm -f th06.ipa

          mkdir -p Payload

          cp -R "$APP" Payload/th06.app

          echo "===== Payload ====="

          find Payload \
            -maxdepth 4 \
            -print

          cd Payload

          zip -r ../th06.ipa th06.app

          cd ..

          echo ""
          echo "===== IPA ====="

          ls -lh th06.ipa

      # ============================================================
      # 16. Verify IPA
      # ============================================================
      - name: Verify IPA
        run: |
          set -e

          if [ ! -f "th06.ipa" ]; then
            echo "ERROR: th06.ipa not found"
            exit 1
          fi

          echo "===== IPA SIZE ====="
          ls -lh th06.ipa

          echo ""
          echo "===== IPA CONTENTS ====="

          unzip -l th06.ipa \
            | head -100

      # ============================================================
      # 17. Upload IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:
          name: th06-ios-arm64-unsigned
          path: th06.ipa
          if-no-files-found: error
