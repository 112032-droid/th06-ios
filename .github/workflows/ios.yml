name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer
      - name: Build
        run: |
          ls -R
          premake5 gmake || premake5 xcode4
          ls -R
          make -j4 || true
          find. -name "*.app" -type d
          find. -name "*.xcodeproj"
          APP=$(find. -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          if [ -n "$APP" ]; then cp -R "$APP" Payload/; else echo "No app found"; ls -R; exit 1; fi
          ls -R Payload
          zip -r th06.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: th06.ipa
