name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download SDL
        run: |
          set -e

          mkdir -p external

          git clone --depth 1 --branch release-2.32.8 \
            https://github.com/libsdl-org/SDL.git \
            external/SDL

          git clone --depth 1 --branch release-2.8.8 \
            https://github.com/libsdl-org/SDL_image.git \
            external/SDL_image

          git clone --depth 1 --branch release-2.24.0 \
            https://github.com/libsdl-org/SDL_ttf.git \
            external/SDL_ttf

      - name: Check SDL2 and SDL_ttf headers
        run: |
          set -e

          echo "========================================"
          echo "SDL headers"
          echo "========================================"

          find external/SDL/include \
            -maxdepth 3 \
            -type f \
            -name "*.h" \
            -print | sort

          echo "========================================"
          echo "SDL_image headers"
          echo "========================================"

          find external/SDL_image/include \
            -maxdepth 3 \
            -type f \
            -name "*.h" \
            -print | sort

          echo "========================================"
          echo "SDL_ttf headers"
          echo "========================================"

          find external/SDL_ttf/include \
            -maxdepth 3 \
            -type f \
            -name "*.h" \
            -print | sort

          echo "========================================"
          echo "Searching SDL_ttf.h everywhere"
          echo "========================================"

          find external/SDL_ttf \
            -type f \
            -name "SDL_ttf.h" \
            -print

      - name: Download SDL_image dependencies
        run: |
          set -e

          cd external/SDL_image

          chmod +x external/download.sh
          ./external/download.sh

          cd ../..

          echo "Checking SDL_image dependencies..."
          find external/SDL_image/external \
            -maxdepth 3 \
            -type d \
            -print || true

      - name: Check libtiff
        run: |
          set -e

          TIFF_DIR="$(find external -type d -iname 'libtiff' | head -n 1 || true)"

          if [ -z "$TIFF_DIR" ]; then
            echo "ERROR: libtiff not found"
            find external -maxdepth 5 -print | head -500
            exit 1
          fi

          echo "Found libtiff:"
          echo "$TIFF_DIR"

          if [ ! -f "$TIFF_DIR/CMakeLists.txt" ]; then
            echo "ERROR: libtiff CMakeLists.txt not found"
            exit 1
          fi

      - name: Download SDL_ttf dependencies
        run: |
          set -e

          cd external/SDL_ttf

          chmod +x external/download.sh
          ./external/download.sh

          cd ../..

      - name: Create unified SDL2 include directory
        run: |
          set -e

          rm -rf include
          mkdir -p include/SDL2

          echo "========================================"
          echo "Copy SDL2 headers"
          echo "========================================"

          if [ -d external/SDL/include ]; then
            cp -f external/SDL/include/*.h include/SDL2/
          else
            echo "ERROR: SDL include directory not found"
            exit 1
          fi

          echo "========================================"
          echo "Copy SDL_image header"
          echo "========================================"

          if [ -f external/SDL_image/include/SDL_image.h ]; then
            cp -f external/SDL_image/include/SDL_image.h include/SDL2/
          else
            echo "WARNING: SDL_image.h not found"
          fi

          echo "========================================"
          echo "Copy SDL_ttf header"
          echo "========================================"

          TTF_HEADER="$(find external/SDL_ttf/include \
            -type f \
            -name "SDL_ttf.h" \
            | head -n 1 || true)"

          if [ -z "$TTF_HEADER" ]; then
            echo "ERROR: SDL_ttf.h not found"

            echo "SDL_ttf directory:"
            find external/SDL_ttf \
              -maxdepth 5 \
              -type f \
              -print | head -300

            exit 1
          fi

          echo "Found:"
          echo "$TTF_HEADER"

          cp -f "$TTF_HEADER" include/SDL2/SDL_ttf.h

          echo "========================================"
          echo "Unified SDL2 Headers"
          echo "========================================"

          ls -la include/SDL2

          echo "========================================"
          echo "Checking required header"
          echo "========================================"

          test -f include/SDL2/SDL.h
          test -f include/SDL2/SDL_ttf.h

          echo "SDL2/SDL.h       OK"
          echo "SDL2/SDL_ttf.h   OK"

      - name: Check FreeType
        run: |
          set -e

          if find external/SDL_ttf \
            -type f \
            -name "ft2build.h" \
            | grep -q .; then

            echo "FreeType OK"

          else

            echo "ERROR: FreeType not found"
            exit 1

          fi

      - name: Check project
        run: |
          set -e

          echo "===== Root ====="
          ls -la

          echo "===== src ====="
          find src \
            -maxdepth 4 \
            -type f \
            | head -200

      - name: Configure iOS ARM64
        run: |
          set -e

          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_HEADER_SEARCH_PATHS="\$(SRCROOT)/include" \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL2_SHARED=OFF \
            -DSDL2IMAGE_VENDORED=ON \
            -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_TESTS=OFF \
            -DSDL2IMAGE_AVIF=OFF \
            -DSDL2IMAGE_WEBP=OFF \
            -DSDL2IMAGE_JXL=OFF \
            -DSDL2TTF_VENDORED=ON \
            -DSDL2TTF_SAMPLES=OFF \
            -DSDL2TTF_TESTS=OFF

      - name: Verify CMake SDL_ttf configuration
        run: |
          set -e

          echo "========================================"
          echo "Searching generated build files"
          echo "========================================"

          find build \
            -type f \
            \( -name "*.cmake" -o -name "*.xcodeproj" \) \
            -print | head -100

          echo "========================================"
          echo "Checking SDL_ttf.h"
          echo "========================================"

          test -f include/SDL2/SDL_ttf.h

          echo "SDL2/SDL_ttf.h is available."

      - name: Build iOS ARM64
        run: |
          set -e

          cmake --build build \
            --config Release \
            --parallel 4

      - name: Find app
        run: |
          set -e

          echo "Searching for app..."

          find build \
            -type d \
            -name "*.app" \
            -print

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          echo "APP=$APP"

      - name: Verify ARM64 iOS binary
        run: |
          set -e

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          BIN="$APP/th06"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: executable not found"
            exit 1
          fi

          echo "===== file ====="
          file "$BIN"

          echo "===== lipo ====="
          lipo -info "$BIN"

          echo "===== platform ====="
          otool -l "$BIN" | \
            grep -A8 LC_BUILD_VERSION || true

          echo "Checking ARM64..."

          lipo -info "$BIN" | grep -q arm64

          echo "ARM64 OK"

          echo "Checking iOS platform..."

          if otool -l "$BIN" | \
            grep -A8 LC_BUILD_VERSION | \
            grep -q PLATFORM_IOS; then

            echo "iOS platform OK"

          else

            echo "WARNING: PLATFORM_IOS was not detected"

          fi

      - name: Package resources
        run: |
          set -e

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -d resources ]; then
            echo "Copying resources..."
            cp -R resources "$APP/"
          else
            echo "No resources directory."
          fi

          echo "===== APP CONTENT ====="
          find "$APP" \
            -maxdepth 4 \
            -print

      - name: Create Info.plist
        run: |
          set -e

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          PLIST="$APP/Info.plist"

          rm -f "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleExecutable string th06" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.example.th06" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string th06" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string 東方紅魔郷" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundlePackageType string APPL" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string 1.0" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string 1" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :LSRequiresIPhoneOS bool true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIDeviceFamily array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIDeviceFamily:0 integer 1" \
            "$PLIST"

          echo "===== Info.plist ====="
          plutil -p "$PLIST"

      - name: Create IPA
        run: |
          set -e

          APP="$(find build \
            -type d \
            -name 'th06.app' \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          rm -rf Payload
          rm -f th06.ipa

          mkdir -p Payload

          cp -R "$APP" Payload/th06.app

          echo "===== Payload ====="
          find Payload \
            -maxdepth 4 \
            -print

          cd Payload

          zip -r ../th06.ipa th06.app

          cd ..

          echo "===== IPA ====="
          ls -lh th06.ipa

      - name: Verify IPA
        run: |
          set -e

          if [ ! -f th06.ipa ]; then
            echo "ERROR: IPA was not created"
            exit 1
          fi

          unzip -l th06.ipa | head -150

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: th06-ios-arm64-unsigned
          path: th06.ipa
          if-no-files-found: error
