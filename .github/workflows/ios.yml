name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check iOS SDK
        run: |
          set -e
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download SDL2
        run: |
          set -e
          mkdir -p external
          git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL.git external/SDL
          git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL_image.git external/SDL_image
          git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL_ttf.git external/SDL_ttf

      - name: Configure iOS ARM64
        run: |
          set -e
          rm -rf build
          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build ARM64
        run: |
          set -e
          cmake --build build --config Release --parallel 4

      - name: Find app
        run: |
          set -e
          find build -maxdepth 6 -type d -name "*.app" -print

      - name: Verify iOS ARM64 binary
        run: |
          set -e

          APP="$(find build -type d -name 'th06.app' | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          BIN="$APP/th06"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: executable not found: $BIN"
            exit 1
          fi

          echo "=== file ==="
          file "$BIN"

          echo "=== architectures ==="
          lipo -info "$BIN"

          echo "=== Mach-O platform ==="
          otool -l "$BIN" | grep -A5 LC_BUILD_VERSION || true

          lipo -info "$BIN" | grep -q arm64
          otool -l "$BIN" | grep -A5 LC_BUILD_VERSION | grep -q PLATFORM_IOS

          echo "iOS ARM64 verification PASSED"

      - name: Package game resources
        run: |
          set -e

          APP="$(find build -type d -name 'th06.app' | head -n 1)"

          if [ -d "resources" ]; then
            cp -R resources "$APP/"
          fi

          if [ -f "th06_config" ]; then
            cp th06_config "$APP/"
          fi

          if [ -f "NotoSans-Regular.ttf" ]; then
            cp NotoSans-Regular.ttf "$APP/"
          fi

          if [ -f "東方紅魔郷" ]; then
            cp "東方紅魔郷" "$APP/"
          fi

          echo "=== APP CONTENTS ==="
          find "$APP" -maxdepth 2 -print

      - name: Create IPA
        run: |
          set -e

          APP="$(find build -type d -name 'th06.app' | head -n 1)"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/th06.app

          cd Payload
          zip -r ../th06.ipa th06.app
          cd ..

          echo "=== IPA ==="
          ls -lh th06.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: th06-ios-arm64-unsigned
          path: th06.ipa
