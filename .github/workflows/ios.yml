name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode and iOS SDK
        run: |
          set -e
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download SDL2
        run: |
          set -e
          mkdir -p external

          git clone --depth 1 --branch release-2.32.8 \
            https://github.com/libsdl-org/SDL.git \
            external/SDL

          git clone --depth 1 --branch release-2.8.8 \
            https://github.com/libsdl-org/SDL_image.git \
            external/SDL_image

          git clone --depth 1 --branch release-2.24.0 \
            https://github.com/libsdl-org/SDL_ttf.git \
            external/SDL_ttf

          echo "SDL2:"
          git -C external/SDL describe --tags --always

          echo "SDL2_image:"
          git -C external/SDL_image describe --tags --always

          echo "SDL2_ttf:"
          git -C external/SDL_ttf describe --tags --always

      - name: Configure iOS ARM64
        run: |
          set -e

          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DSDL_TESTS=OFF \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL2IMAGE_VENDORED=OFF \
            -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_TESTS=OFF \
            -DSDL2TTF_VENDORED=OFF \
            -DSDL2TTF_SAMPLES=OFF \
            -DSDL2TTF_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build iOS ARM64
        run: |
          set -e

          cmake --build build \
            --config Release \
            --parallel 4

      - name: Find application
        run: |
          set -e

          echo "Searching for .app:"
          find build -type d -name "*.app" -print

      - name: Verify iOS ARM64
        run: |
          set -e

          APP="$(find build -type d -name 'th06.app' | head -n 1)"

          if [ -z "$APP" ]; then
            echo "ERROR: th06.app not found"
            exit 1
          fi

          BIN="$APP/th06"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: executable not found"
            exit 1
          fi

          echo "===== FILE ====="
          file "$BIN"

          echo "===== LIPO ====="
          lipo -info "$BIN"

          echo "===== PLATFORM ====="
          otool -l "$BIN" | grep -A8 LC_BUILD_VERSION || true

          if ! lipo -info "$BIN" | grep -q arm64; then
            echo "ERROR: arm64 not found"
            exit 1
          fi

          if ! otool -l "$BIN" | grep -A8 LC_BUILD_VERSION | grep -q PLATFORM_IOS; then
            echo "ERROR: binary is not an iOS binary"
            exit 1
          fi

          echo "================================"
          echo "iOS ARM64 verification PASSED"
          echo "================================"

      - name: Package game resources
        run: |
          set -e

          APP="$(find build -type d -name 'th06.app' | head -n 1)"

          if [ -d "resources" ]; then
            cp -R resources "$APP/"
          fi

          if [ -f "th06_config" ]; then
            cp th06_config "$APP/"
          fi

          if [ -f "NotoSans-Regular.ttf" ]; then
            cp NotoSans-Regular.ttf "$APP/"
          fi

          if [ -f "東方紅魔郷" ]; then
            cp "東方紅魔郷" "$APP/"
          fi

          echo "===== APP CONTENTS ====="
          find "$APP" -maxdepth 3 -print

      - name: Create IPA
        run: |
          set -e

          APP="$(find build -type d -name 'th06.app' | head -n 1)"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/th06.app

          cd Payload
          zip -r ../th06.ipa th06.app
          cd ..

          echo "===== IPA ====="
          ls -lh th06.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: th06-ios-arm64-unsigned
          path: th06.ipa
