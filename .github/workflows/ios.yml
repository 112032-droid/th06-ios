name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download SDL
        run: |
          set -e

          mkdir -p external

          git clone --depth 1 --branch release-2.32.8 \
            https://github.com/libsdl-org/SDL.git \
            external/SDL

          git clone --depth 1 --branch release-2.8.8 \
            https://github.com/libsdl-org/SDL_image.git \
            external/SDL_image

          git clone --depth 1 --branch release-2.24.0 \
            https://github.com/libsdl-org/SDL_ttf.git \
            external/SDL_ttf

      - name: Download SDL_image dependencies
        run: |
          set -e
          cd external/SDL_image
          chmod +x external/download.sh
          ./external/download.sh
          cd ../..

      - name: Download SDL_ttf dependencies
        run: |
          set -e
          cd external/SDL_ttf
          chmod +x external/download.sh
          ./external/download.sh
          cd ../..

      - name: Create unified SDL2 include directory
        run: |
          set -e
          mkdir -p include/SDL2

          # 收集核心 SDL 標頭檔
          if [ -d external/SDL/include ]; then
            cp -f external/SDL/include/*.h include/SDL2/ || true
          fi

          # 收集 SDL_image 標頭檔
          if [ -f external/SDL_image/include/SDL_image.h ]; then
            cp -f external/SDL_image/include/SDL_image.h include/SDL2/ || true
          fi

          # 收集 SDL_ttf 標頭檔
          if [ -f external/SDL_ttf/include/SDL_ttf.h ]; then
            cp -f external/SDL_ttf/include/SDL_ttf.h include/SDL2/ || true
          fi

          echo "===== Unified SDL2 Headers ====="
          ls -la include/SDL2

      - name: Configure iOS ARM64
        run: |
          set -e

          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/include" \
            -DCMAKE_C_FLAGS="-I${{ github.workspace }}/include" \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL2_SHARED=OFF \
            -DSDL2IMAGE_VENDORED=ON \
            -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_TESTS=OFF \
            -DSDL2IMAGE_AVIF=OFF \
            -DSDL2IMAGE_WEBP=OFF \
            -DSDL2IMAGE_JXL=OFF \
            -DSDL2TTF_VENDORED=ON \
            -DSDL2TTF_SAMPLES=OFF \
            -DSDL2TTF_TESTS=OFF

      - name: Build iOS ARM64
        run: |
          set -e

          cmake --build build \
            --config Release \
            --parallel 4
