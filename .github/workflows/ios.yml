name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer
      - name: Build
        run: |
          pwd
          ls -la
          cat premake5.lua | head -n 50 || true
          premake5 --version
          premake5 gmake2
          ls -la
          ls -la build || true
          cat build/Makefile | head -n 20 || true
          sed -i '' 's/-Werror//g' build/*.make || true
          make -C build -j4 CXXFLAGS="-w -Wno-error" CFLAGS="-w -Wno-error"
          echo "==== find files ===="
          find. -name "*.app" -type d
          find. -name "th06" -type f | head -n 20
          APP=$(find. -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          ls -lh build/
          mkdir -p Payload
          if [ -n "$APP" ]; then
            cp -R "$APP" Payload/
          else
            mkdir -p Payload/th06.app
            cp build/th06 Payload/th06.app/ 2>/dev/null || cp build/bin/* Payload/th06.app/ 2>/dev/null || true
            # 如果真的只有執行檔，也包起來
            find build -type f -maxdepth 3 | head -n 20
          fi
          ls -R Payload
          cd Payload
          zip -r../th06.ipa.
          cd..
          ls -lh th06.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: th06.ipa
