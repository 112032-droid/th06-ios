name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer
      - name: Build
        run: |
          premake5 gmake2
          # 關掉 -Werror 讓警告不會變錯誤
          sed -i '' 's/-Werror//g' build/*.make
          sed -i '' 's/-Wextra//g' build/*.make || true
          make -C build -j4 CXXFLAGS="-w" CFLAGS="-w" || make -C build -j4 --keep-going CXXFLAGS="-w" CFLAGS="-w" || true
          echo "---- RESULT ----"
          ls -lh build/
          find. -name "*.a" -o -name "th06" -type f | head -n 20
          APP=$(find. -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          if [ -n "$APP" ]; then
            cp -R "$APP" Payload/
          else
            # 如果還是沒.app，就把執行檔包成.app
            mkdir -p Payload/th06.app
            find build -type f -perm +111 | head -n 5 | xargs -I {} cp {} Payload/th06.app/ 2>/dev/null || true
            cp build/th06 Payload/th06.app/ 2>/dev/null || cp build/gmake2/th06 Payload/th06.app/ 2>/dev/null || true
          fi
          ls -R Payload
          zip -r th06.ipa Payload
          ls -lh th06.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: th06.ipa
