name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer sdl2_image sdl2_ttf
      - name: Build
        run: |
          set -x
          premake5 gmake2
          cat build/*.make | head -n 100 || true
          sed -i '' 's/-Werror//g' build/*.make || true
          make -C build config=release -j4 CXXFLAGS="-w" CFLAGS="-w" || make -C build -j4 CXXFLAGS="-w" CFLAGS="-w" || true
          ls -lh build/
          find. -type f -name "th06" | xargs ls -lh || true
          mkdir -p Payload/th06.app
          cp build/th06 Payload/th06.app/th06 2>/dev/null || find build -type f -name "th06" -exec cp {} Payload/th06.app/th06 \; || true
          ls -lh Payload/th06.app/
          echo '<?xml version="1.0"?><plist><dict><key>CFBundleExecutable</key><string>th06</string><key>CFBundleIdentifier</key><string>com.touhou.th06</string><key>CFBundleName</key><string>th06</string></dict></plist>' > Payload/th06.app/Info.plist
          zip -r th06.ipa Payload
          ls -lh th06.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: |
            th06.ipa
            build/
          if-no-files-found: warn
