name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Check Xcode
      # ============================================================

      - name: Check Xcode
        run: |
          echo "===== Xcode ====="
          xcodebuild -version

          echo ""
          echo "===== macOS ====="
          sw_vers

          echo ""
          echo "===== iOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-path


      # ============================================================
      # Download SDL2
      # ============================================================

      - name: Download SDL2
        run: |
          set -e

          mkdir -p external

          git clone --depth 1 \
            --branch release-2.32.8 \
            https://github.com/libsdl-org/SDL.git \
            external/SDL


      # ============================================================
      # Download SDL2_image
      # ============================================================

      - name: Download SDL2_image
        run: |
          set -e

          git clone --depth 1 \
            --branch release-2.8.8 \
            https://github.com/libsdl-org/SDL_image.git \
            external/SDL_image


      # ============================================================
      # Download SDL2_ttf
      # ============================================================

      - name: Download SDL2_ttf
        run: |
          set -e

          git clone --depth 1 \
            --branch release-2.24.0 \
            https://github.com/libsdl-org/SDL_ttf.git \
            external/SDL_ttf


      # ============================================================
      # Check downloaded libraries
      # ============================================================

      - name: Check SDL libraries
        run: |
          set -e

          echo "===== external ====="
          find external -maxdepth 2 -type f | head -100

          echo ""
          echo "===== SDL2 ====="
          test -d external/SDL
          test -f external/SDL/include/SDL.h
          echo "SDL2 OK"

          echo ""
          echo "===== SDL2_image ====="
          test -d external/SDL_image
          test -f external/SDL_image/include/SDL_image.h
          echo "SDL2_image OK"

          echo ""
          echo "===== SDL2_ttf ====="
          test -d external/SDL_ttf
          test -f external/SDL_ttf/SDL_ttf.h
          echo "SDL2_ttf OK"

          echo ""
          echo "SDL_ttf.h location:"
          find external/SDL_ttf -type f -name "SDL_ttf.h"


      # ============================================================
      # Download SDL2_image dependencies
      # ============================================================

      - name: Download SDL2_image dependencies
        run: |
          set -e

          cd external/SDL_image

          if [ -f external/download.sh ]; then
            chmod +x external/download.sh
            ./external/download.sh
          else
            echo "SDL_image download.sh not found"
          fi


      # ============================================================
      # Download SDL2_ttf dependencies
      # ============================================================

      - name: Download SDL2_ttf dependencies
        run: |
          set -e

          cd external/SDL_ttf

          if [ -f external/download.sh ]; then
            chmod +x external/download.sh
            ./external/download.sh
          else
            echo "SDL_ttf download.sh not found"
          fi


      # ============================================================
      # Check FreeType
      # ============================================================

      - name: Check FreeType
        run: |
          echo "===== FreeType ====="

          find external/SDL_ttf \
            -type f \
            -name "ft2build.h" \
            -print

          echo ""

          if find external/SDL_ttf \
            -type f \
            -name "ft2build.h" \
            | grep -q .; then
            echo "FreeType headers found"
          else
            echo "WARNING: FreeType headers not found"
          fi


      # ============================================================
      # Create unified SDL2 include directory
      # ============================================================

      - name: Create unified SDL2 include directory
        run: |
          set -e

          rm -rf include
          mkdir -p include/SDL2

          echo "===== Copy SDL2 headers ====="

          cp -f external/SDL/include/*.h \
            include/SDL2/

          echo "===== Copy SDL2_image header ====="

          if [ -f external/SDL_image/include/SDL_image.h ]; then
            cp -f external/SDL_image/include/SDL_image.h \
              include/SDL2/SDL_image.h
          else
            echo "ERROR: SDL_image.h not found"
            exit 1
          fi

          echo "===== Copy SDL2_ttf header ====="

          if [ -f external/SDL_ttf/SDL_ttf.h ]; then
            cp -f external/SDL_ttf/SDL_ttf.h \
              include/SDL2/SDL_ttf.h
          else
            echo "ERROR: SDL_ttf.h not found"
            exit 1
          fi

          echo ""
          echo "===== Unified headers ====="

          ls -la include/SDL2

          echo ""
          echo "===== Required headers ====="

          test -f include/SDL2/SDL.h
          test -f include/SDL2/SDL_image.h
          test -f include/SDL2/SDL_ttf.h

          echo ""
          echo "All SDL2 headers OK"


      # ============================================================
      # Check project files
      # ============================================================

      - name: Check project
        run: |
          set -e

          echo "===== Project ====="
          ls -la

          echo ""
          echo "===== Source ====="
          find src -type f | head -100

          echo ""
          echo "===== Required files ====="

          test -f CMakeLists.txt
          test -f embed_shaders.cmake
          test -f src/main_ios.mm
          test -f Info.plist

          echo "CMakeLists.txt OK"
          echo "embed_shaders.cmake OK"
          echo "main_ios.mm OK"
          echo "Info.plist OK"


      # ============================================================
      # Check shader files
      # ============================================================

      - name: Check shaders
        run: |
          set -e

          echo "===== Shader files ====="

          if [ -f src/graphics/ff.vert ]; then
            echo "ff.vert found"
          else
            echo "WARNING: ff.vert not found"
          fi

          if [ -f src/graphics/ff.frag ]; then
            echo "ff.frag found"
          else
            echo "WARNING: ff.frag not found"
          fi


      # ============================================================
      # Configure CMake
      # ============================================================

      - name: Configure iOS ARM64
        run: |
          set -e

          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_HEADER_SEARCH_PATHS='$(SRCROOT)/include' \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL2_SHARED=OFF \
            -DSDL2_STATIC=ON \
            -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_TESTS=OFF \
            -DSDL2IMAGE_VENDORED=ON \
            -DSDL2IMAGE_SHARED=OFF \
            -DSDL2IMAGE_AVIF=OFF \
            -DSDL2IMAGE_WEBP=OFF \
            -DSDL2IMAGE_JXL=OFF \
            -DSDL2TTF_SAMPLES=OFF \
            -DSDL2TTF_TESTS=OFF \
            -DSDL2TTF_VENDORED=ON

          echo ""
          echo "===== CMake configuration completed ====="


      # ============================================================
      # Check generated Xcode project
      # ============================================================

      - name: Check Xcode project
        run: |
          set -e

          echo "===== Build directory ====="
          find build -maxdepth 2 -type f | head -100

          echo ""
          echo "===== Xcode projects ====="
          find build -name "*.xcodeproj" -print


      # ============================================================
      # Build
      # ============================================================

      - name: Build iOS
        run: |
          set -e

          cmake \
            --build build \
            --config Release \
            -- -sdk iphoneos \
               ARCHS=arm64 \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGN_IDENTITY=""


      # ============================================================
      # Find application
      # ============================================================

      - name: Find application
        run: |
          set -e

          echo "===== Searching for .app ====="

          find build \
            -type d \
            -name "*.app" \
            -print


      # ============================================================
      # Fix final iOS Info.plist
      #
      # IMPORTANT:
      # This must happen BEFORE Verify ARM64.
      # ============================================================

      - name: Fix Info.plist
        run: |
          set -e

          APP_PATH=$(find build \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          PLIST="$APP_PATH/Info.plist"

          echo "========================================"
          echo "iOS App Bundle"
          echo "========================================"

          echo "APP:"
          echo "$APP_PATH"

          echo ""
          echo "Info.plist:"
          echo "$PLIST"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist does not exist"
            exit 1
          fi


          # --------------------------------------------------------
          # CFBundleExecutable
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable th06" \
            "$PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleExecutable string th06" \
            "$PLIST"


          # --------------------------------------------------------
          # CFBundleIdentifier
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier com.example.th06" \
            "$PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string com.example.th06"


          # --------------------------------------------------------
          # CFBundleDisplayName
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName 東方紅魔郷" \
            "$PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string 東方紅魔郷" \
            "$PLIST"


          # --------------------------------------------------------
          # CFBundlePackageType
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundlePackageType APPL" \
            "$PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundlePackageType string APPL" \
            "$PLIST"


          # --------------------------------------------------------
          # LSRequiresIPhoneOS
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Set :LSRequiresIPhoneOS true" \
            "$PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :LSRequiresIPhoneOS bool true" \
            "$PLIST"


          # --------------------------------------------------------
          # Version
          # --------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString 1.0" \
            "$PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleShortVersionString string 1.0" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion 1" \
            "$PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string 1"


          echo ""
          echo "========================================"
          echo "Final Info.plist"
          echo "========================================"

          plutil -p "$PLIST"

          echo ""
          echo "========================================"
          echo "CFBundleExecutable"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"


      # ============================================================
      # Package resources
      # ============================================================

      - name: Package resources
        run: |
          set -e

          APP_PATH=$(find build \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          echo "App path:"
          echo "$APP_PATH"

          if [ -d resources ]; then

            echo ""
            echo "===== Copy resources ====="

            cp -R resources/. "$APP_PATH/"

          else

            echo "No resources directory found"

          fi


      # ============================================================
      # Verify ARM64 binary
      # ============================================================

      - name: Verify ARM64 iOS binary
        run: |
          set -e

          APP_PATH=$(find build \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          echo "APP:"
          echo "$APP_PATH"


          # --------------------------------------------------------
          # Read executable from Info.plist
          # --------------------------------------------------------

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$APP_PATH/Info.plist"
          )

          echo ""
          echo "Executable:"
          echo "$EXECUTABLE"


          # --------------------------------------------------------
          # Check executable
          # --------------------------------------------------------

          BINARY="$APP_PATH/$EXECUTABLE"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Executable not found:"
            echo "$BINARY"

            echo ""
            echo "===== App contents ====="
            find "$APP_PATH" -maxdepth 2 -print

            exit 1
          fi


          echo ""
          echo "===== file ====="

          file "$BINARY"


          echo ""
          echo "===== Architectures ====="

          lipo -info "$BINARY"


          echo ""
          echo "===== SDK ====="

          otool -l "$BINARY" \
            | grep -A4 LC_BUILD_VERSION \
            | head -20 || true


      # ============================================================
      # Verify Info.plist
      # ============================================================

      - name: Verify Info.plist
        run: |
          set -e

          APP_PATH=$(find build \
            -type d \
            -name "*.app" \
            | head -1)

          PLIST="$APP_PATH/Info.plist"

          echo "===== Info.plist verification ====="

          echo ""
          echo "CFBundleExecutable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST"

          echo ""
          echo "CFBundleIdentifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo ""
          echo "CFBundlePackageType:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundlePackageType" \
            "$PLIST"

          echo ""
          echo "Info.plist OK"


      # ============================================================
      # Create IPA
      # ============================================================

      - name: Create IPA
        run: |
          set -e

          APP_PATH=$(find build \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          rm -rf Payload
          rm -f th06.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          echo "===== Payload ====="
          find Payload -maxdepth 2 -print

          zip -r th06.ipa Payload

          echo ""
          echo "===== IPA ====="
          ls -lh th06.ipa


      # ============================================================
      # Verify IPA
      # ============================================================

      - name: Verify IPA
        run: |
          set -e

          test -f th06.ipa

          echo "===== IPA information ====="

          unzip -l th06.ipa

          echo ""
          echo "IPA created successfully"


      # ============================================================
      # Upload IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:
          name: th06-ios-ipa
          path: th06.ipa
          if-no-files-found: error
