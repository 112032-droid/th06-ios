name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer sdl2_image sdl2_ttf
      - name: Build
        run: |
          premake5 gmake2
          sed -i '' 's/-Werror//g' build/*.make || true
          make -C build -j4 CXXFLAGS="-w" CFLAGS="-w"
          echo "=== BUILD DONE ==="
          ls -lh build/
          mkdir -p Payload
          APP=$(find. -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          if [ -n "$APP" ]; then
            cp -R "$APP" Payload/
          else
            mkdir -p Payload/th06.app
            cp build/th06 Payload/th06.app/ 2>/dev/null || cp build/gmake2/th06 Payload/th06.app/ || true
            ls build/
          fi
          ls -R Payload
          zip -r th06.ipa Payload
          ls -lh th06.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: th06.ipa
