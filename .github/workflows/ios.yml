name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer
      - name: Build IPA
        run: |
          ls -R | head -n 100
          premake5 xcode4 || premake5 gmake2
          ls -R | head -n 100
          # 先試著用 Xcode 編 iOS
          xcodebuild -list -project th06.xcodeproj 2>/dev/null || true
          xcodebuild -project th06.xcodeproj -configuration Release CODE_SIGNING_ALLOWED=NO -sdk iphoneos SYMROOT=build_ios -j4 || true
          xcodebuild -project th06.xcodeproj -alltargets -configuration Release CODE_SIGNING_ALLOWED=NO -sdk iphoneos SYMROOT=build_ios || true
          # 如果 Xcode 不行，再試 make 關掉警告
          sed -i '' 's/-Werror//g' build/*.make 2>/dev/null || true
          make -C build -j4 CXXFLAGS="-w" CFLAGS="-w" || true
          echo "====== FIND APP ======"
          find. -name "*.app" -type d
          find. -name "*.ipa" -o -name "th06" -type f | head -n 20
          APP=$(find. -name "*.app" -type d | head -n 1)
          echo "Found APP: $APP"
          mkdir -p Payload
          if [ -n "$APP" ]; then
            cp -R "$APP" Payload/
          else
            echo "No.app, creating dummy from build output"
            mkdir -p Payload/th06.app
            cp -R build_ios/Release-iphoneos/*.app/* Payload/th06.app/ 2>/dev/null || true
            find build_ios -name "*.app" -exec cp -R {} Payload/ \; 2>/dev/null || true
          fi
          ls -lhR Payload
          zip -r th06.ipa Payload
          ls -lh th06.ipa
          # 如果還是太小就報錯
          SIZE=$(wc -c < th06.ipa)
          echo "IPA SIZE: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then echo "IPA too small, build failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: th06.ipa
