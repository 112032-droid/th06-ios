name: Build Touhou TH06 for iOS

on:
  push:

  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:

      # ============================================================
      # Checkout source
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # Check repository
      # ============================================================
      - name: Check repository
        run: |
          set -e

          echo "========================================"
          echo "Repository"
          echo "========================================"

          pwd
          echo ""

          echo "Root files:"
          ls -lah

          echo ""
          echo "Source files:"
          find src -maxdepth 2 -type f | head -100 || true

      # ============================================================
      # Check TH06 game data
      # ============================================================
      - name: Check TH06 game data
        run: |
          set -e

          echo "========================================"
          echo "Checking TH06 game data"
          echo "========================================"

          if [ ! -d "game" ]; then
            echo "ERROR: game/ directory not found"
            exit 1
          fi

          echo "game/ directory found"
          echo ""

          ls -lh game

      # ============================================================
      # Check original English DAT files
      # ============================================================
      - name: Check TH06 DAT files
        run: |
          set -e

          echo "========================================"
          echo "Checking expected English DAT files"
          echo "========================================"

          required_files=(
            "th06e_IN.DAT"
            "th06e_ST.DAT"
            "th06e_TL.DAT"
            "th06e_MD.DAT"
            "th06e_ED.DAT"
            "th06e_CM.DAT"
          )

          for file in "${required_files[@]}"; do
            if [ -f "game/$file" ]; then
              echo "OK: $file"
              ls -lh "game/$file"
            else
              echo "ERROR: missing game/$file"
              exit 1
            fi
          done

      # ============================================================
      # Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install cmake || true

      # ============================================================
      # Configure iOS ARM64
      # ============================================================
      - name: Configure iOS ARM64
        run: |
          set -e

          echo "========================================"
          echo "Configure iOS ARM64"
          echo "========================================"

          rm -rf build

          cmake -S . -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release

      # ============================================================
      # Build iOS
      # ============================================================
      - name: Build iOS
        run: |
          set -e

          echo "========================================"
          echo "Build iOS"
          echo "========================================"

          cmake --build build \
            --config Release \
            -- -quiet

      # ============================================================
      # Find app
      # ============================================================
      - name: Find application
        run: |
          set -e

          echo "========================================"
          echo "Searching for .app"
          echo "========================================"

          find build -type d -name "*.app" -print

          APP_PATH=$(find build -type d -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "Using:"
          echo "$APP_PATH"

      # ============================================================
      # Fix Info.plist
      # ============================================================
      - name: Fix Info.plist
        run: |
          set -e

          echo "========================================"
          echo "Fix Info.plist"
          echo "========================================"

          if [ -f "$APP_PATH/Info.plist" ]; then

            /usr/libexec/PlistBuddy \
              -c "Add :CFBundleSupportedPlatforms array" \
              "$APP_PATH/Info.plist" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Add :CFBundleSupportedPlatforms:0 string iPhoneOS" \
              "$APP_PATH/Info.plist" 2>/dev/null || true

          else
            echo "WARNING: Info.plist not found"
          fi

      # ============================================================
      # Copy TH06 game data
      #
      # Original:
      #   th06e_IN.DAT
      #   th06e_ST.DAT
      #   th06e_TL.DAT
      #   th06e_MD.DAT
      #   th06e_ED.DAT
      #   th06e_CM.DAT
      #
      # App:
      #   KOUMAKYO_IN.dat
      #   KOUMAKYO_ST.dat
      #   KOUMAKYO_TL.dat
      #   KOUMAKYO_MD.dat
      #   KOUMAKYO_ED.dat
      #   KOUMAKYO_CM.dat
      # ============================================================
      - name: Copy TH06 game data
        run: |
          set -e

          echo "========================================"
          echo "Copy TH06 game data"
          echo "========================================"

          cp "game/th06e_IN.DAT" "$APP_PATH/KOUMAKYO_IN.dat"
          cp "game/th06e_ST.DAT" "$APP_PATH/KOUMAKYO_ST.dat"
          cp "game/th06e_TL.DAT" "$APP_PATH/KOUMAKYO_TL.dat"
          cp "game/th06e_MD.DAT" "$APP_PATH/KOUMAKYO_MD.dat"
          cp "game/th06e_ED.DAT" "$APP_PATH/KOUMAKYO_ED.dat"
          cp "game/th06e_CM.DAT" "$APP_PATH/KOUMAKYO_CM.dat"

          echo ""
          echo "DAT files copied."

          ls -lh "$APP_PATH"/KOUMAKYO_*.dat

      # ============================================================
      # Verify TH06 DAT files inside app
      # ============================================================
      - name: Verify TH06 game data in app
        run: |
          set -e

          echo "========================================"
          echo "Verify TH06 game data in app"
          echo "========================================"

          required_app_files=(
            "KOUMAKYO_IN.dat"
            "KOUMAKYO_ST.dat"
            "KOUMAKYO_TL.dat"
            "KOUMAKYO_MD.dat"
            "KOUMAKYO_ED.dat"
            "KOUMAKYO_CM.dat"
          )

          for file in "${required_app_files[@]}"; do
            if [ -f "$APP_PATH/$file" ]; then
              echo "OK: $file"
              ls -lh "$APP_PATH/$file"
            else
              echo "ERROR: $file missing from app"
              exit 1
            fi
          done

          echo ""
          echo "Checking old incorrect names..."

          if ls "$APP_PATH"/th06e_*.DAT >/dev/null 2>&1; then
            echo "WARNING: old th06e_*.DAT files are still present"
          else
            echo "OK: old DAT names are not present"
          fi

          echo ""
          echo "Checking optional bgm directory..."

          if [ -d "$APP_PATH/bgm" ]; then
            echo "INFO: bgm/ included"
            find "$APP_PATH/bgm" -maxdepth 2 -type f | head -50
          else
            echo "INFO: bgm/ not included"
          fi

      # ============================================================
      # Package resources
      # ============================================================
      - name: Package resources
        run: |
          set -e

          echo "========================================"
          echo "Package resources"
          echo "========================================"

          if [ -d "resources" ]; then
            cp -R resources/. "$APP_PATH/"
            echo "resources/ copied"
          else
            echo "INFO: resources/ directory not found"
          fi

          echo ""
          echo "Checking physical data directory..."

          if [ -d "data" ]; then
            echo "data/ directory found"
            echo ""

            find data -maxdepth 3 -type f | sort | head -200

            cp -R data "$APP_PATH/"
            echo ""
            echo "data/ copied"

            if [ -f "$APP_PATH/data/wav/plst00.wav" ]; then
              echo "OK: physical data/wav/plst00.wav"
              ls -lh "$APP_PATH/data/wav/plst00.wav"
            else
              echo "INFO: physical data/wav/plst00.wav not found"
            fi
          else
            echo "INFO: data/ directory not found"
            echo "INFO: This is NOT automatically an error."
            echo "INFO: data/wav/plst00.wav may be stored inside a PBG3/DAT archive."
          fi

      # ============================================================
      # Show final application contents
      # ============================================================
      - name: Inspect application
        run: |
          set -e

          echo "========================================"
          echo "Application contents"
          echo "========================================"

          echo ""
          echo "Top level:"
          find "$APP_PATH" -maxdepth 1 -type f -print | sort

          echo ""
          echo "Directories:"
          find "$APP_PATH" -maxdepth 2 -type d -print | sort

          echo ""
          echo "DAT files:"
          find "$APP_PATH" -maxdepth 1 \
            \( -iname "*.dat" \) \
            -print \
            -exec ls -lh {} \;

          echo ""
          echo "Searching for physical WAV files..."

          find "$APP_PATH" \
            -type f \
            \( -iname "*.wav" \) \
            -print | head -100 || true

      # ============================================================
      # Create IPA
      # ============================================================
      - name: Package IPA
        run: |
          set -e

          echo "========================================"
          echo "Package IPA"
          echo "========================================"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f TouhouTH06.ipa

          cd Payload
          zip -r ../TouhouTH06.ipa . >/dev/null
          cd ..

          echo ""
          echo "IPA created:"
          ls -lh TouhouTH06.ipa

      # ============================================================
      # Verify IPA
      # ============================================================
      - name: Verify IPA
        run: |
          set -e

          echo "========================================"
          echo "Verify IPA"
          echo "========================================"

          unzip -l TouhouTH06.ipa > ipa-list.txt

          echo ""
          echo "Checking KOUMAKYO DAT files..."

          for file in \
            "KOUMAKYO_IN.dat" \
            "KOUMAKYO_ST.dat" \
            "KOUMAKYO_TL.dat" \
            "KOUMAKYO_MD.dat" \
            "KOUMAKYO_ED.dat" \
            "KOUMAKYO_CM.dat"
          do
            if grep -q "$file" ipa-list.txt; then
              echo "OK: $file"
            else
              echo "ERROR: $file is missing from IPA"
              exit 1
            fi
          done

          echo ""
          echo "Checking physical data/wav/plst00.wav..."

          if grep -qE \
            'Payload/.+\.app/data/wav/plst00\.wav' \
            ipa-list.txt; then
            echo "OK: physical data/wav/plst00.wav is inside IPA"
          else
            echo "INFO: physical data/wav/plst00.wav is not inside IPA"
          fi

          echo ""
          echo "Checking WAV files inside IPA..."

          if grep -qiE \
            'Payload/.+\.app/.+\.wav' \
            ipa-list.txt; then
            echo "WAV files found in IPA:"
            grep -iE \
              'Payload/.+\.app/.+\.wav' \
              ipa-list.txt | head -100
          else
            echo "INFO: no physical WAV files found in IPA"
            echo "INFO: WAV files may be stored inside DAT archives."
          fi

          echo ""
          echo "IPA verification completed."

      # ============================================================
      # Upload IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TouhouTH06-iOS
          path: TouhouTH06.ipa
          if-no-files-found: error
