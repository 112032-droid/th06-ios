name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer sdl2_image sdl2_ttf
      - name: Build
        run: |
          premake5 gmake2
          make -C build -j4 CXXFLAGS="-w" CFLAGS="-w"
          echo "=== list build ==="
          ls -lh build/
          echo "=== find bin ==="
          find. -type f -name "th06" -exec ls -lh {} \;
          mkdir -p Payload/th06.app
          find. -type f -name "th06" -size +100k -exec cp {} Payload/th06.app/th06 \;
          echo '<?xml version="1.0"?><plist><dict><key>CFBundleExecutable</key><string>th06</string><key>CFBundleIdentifier</key><string>com.touhou.th06</string><key>CFBundleName</key><string>th06</string></dict></plist>' > Payload/th06.app/Info.plist
          ls -lh Payload/th06.app/
          zip -r th06.ipa Payload
          ls -lh th06.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: th06.ipa
