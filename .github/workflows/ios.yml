name: Build IPA online
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install premake sdl2 sdl2_mixer
      - name: Build
        run: |
          premake5 gmake2
          make -C build -j4
          ls build/
          find. -name "*.app" -type d
          APP=$(find. -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/ 2>/dev/null || cp -R build/*.app Payload/ 2>/dev/null || true
          ls -lhR Payload
          zip -r th06.ipa Payload
          ls -lh th06.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: th06-ipa
          path: th06.ipa
